services:
  fastapi-red:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-red
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      # Optional AWS S3 / MinIO configuration for s3-in / s3-out nodes
      # - AWS_ENDPOINT_URL=http://minio:9000
      # - AWS_ACCESS_KEY_ID=minioadmin
      # - AWS_SECRET_ACCESS_KEY=minioadmin
      # - AWS_DEFAULT_REGION=us-east-1
    volumes:
      # Persistent flow definitions and credentials
      - ./storage:/app/storage
      # Custom node templates (optional, for live node development)
      - ./nodes:/app/nodes:ro

